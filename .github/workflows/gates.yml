name: KNOuX REC gates

# Every gate here mirrors a command that was executed and observed on a real Windows
# workstation before being added. Nothing in this workflow is aspirational.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Type check, lint, tests, build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit and UI acceptance tests
        run: npm test

      - name: Build renderer
        run: npm run build

      # The blank-window guard for this job lives in tests/packaged-renderer.test.ts,
      # which npm test already runs. verify:release is intentionally not used here
      # because it also asserts the native runtimes, which this job does not provision.

  media-runtime:
    name: FFmpeg, export, caption and recovery runtime
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision the verified FFmpeg runtime
        # Downloads the pinned archive and verifies its SHA-256 before use.
        run: npm run build:ffmpeg

      - name: FFmpeg runtime smoke
        run: npm run test:ffmpeg

      - name: Build renderer
        run: npm run build

      - name: Local MP4 export smoke
        run: npm run test:export

      - name: Project trim export smoke
        run: npm run test:project-export

      - name: Caption SRT smoke
        run: npm run test:caption-srt

      - name: Interrupted-session recovery smoke
        run: npm run test:recovery

      - name: Release verification
        run: npm run verify:release
